name: release
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # only this job publishes the release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: plugin/package-lock.json
      - name: Tag must match plugin/package.json
        run: |
          V=$(node -p "require('./plugin/package.json').version")
          if [ "v$V" != "${GITHUB_REF_NAME}" ]; then echo "Tag ${GITHUB_REF_NAME} != package.json v$V"; exit 1; fi
      - name: Build and test
        working-directory: plugin
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
      - name: Package
        run: |
          NAME="figma-library-icon-toolkit-${GITHUB_REF_NAME}"
          mkdir -p dist/$NAME
          cp plugin/manifest.json dist/$NAME/
          cp -R plugin/build dist/$NAME/build
          cp LICENSE THIRD_PARTY_NOTICES.md dist/$NAME/
          (cd dist && zip -r $NAME.zip $NAME && sha256sum $NAME.zip > $NAME.zip.sha256)
          echo "ASSET=dist/$NAME.zip" >> "$GITHUB_ENV"
          echo "ASSET_SUM=dist/$NAME.zip.sha256" >> "$GITHUB_ENV"
      - name: Release notes from CHANGELOG
        run: |
          V="${GITHUB_REF_NAME#v}"
          awk -v v="$V" '$0 ~ "^## \\["v"\\]"{f=1;next} /^## \[/{f=0} f' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md" > notes.md
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRE=""
          case "${GITHUB_REF_NAME}" in *-*) PRE="--prerelease";; esac
          gh release create "${GITHUB_REF_NAME}" "$ASSET" "$ASSET_SUM" --title "${GITHUB_REF_NAME}" --notes-file notes.md $PRE
