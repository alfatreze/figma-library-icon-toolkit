name: ci
on:
  push:
  pull_request:
# least privilege: CI only reads the repository
permissions:
  contents: read
jobs:
  plugin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugin
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: plugin/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Third-party notices are up to date
        working-directory: .
        run: node scripts/generate-notices.mjs && git diff --exit-code THIRD_PARTY_NOTICES.md
      - name: Size budgets (export formats + plugin bundle)
        working-directory: .
        run: node scripts/size-budget.mjs

  # The generated code must compile with the real toolchains, not just type-check as plain TypeScript.
  generated-code:
    runs-on: ubuntu-latest
    # "latest" toolchains have no lockfile on purpose (they tell us when a new Angular breaks the output) but must not block merges
    continue-on-error: ${{ matrix.toolchain == 'ng-latest' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: angular-classic on Angular 14, toolchain: ng14, kind: angular-classic }
          - { name: angular-classic on latest Angular, toolchain: ng-latest, kind: angular-classic }
          - { name: angular (signals) on Angular 17.1, toolchain: ng17, kind: angular }
          - { name: angular (signals) on latest Angular, toolchain: ng-latest, kind: angular }
          - { name: react on React 18, toolchain: react18, kind: react }
          - { name: web-component, toolchain: react18, kind: web-component }
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: plugin/package-lock.json
      - run: npm ci
        working-directory: plugin
      - name: Install toolchain
        working-directory: scripts/toolchains/${{ matrix.toolchain }}
        run: if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
      - run: node scripts/compile-check.mjs --toolchain scripts/toolchains/${{ matrix.toolchain }} --kind ${{ matrix.kind }}

  # Renders the export in Chromium: inline SVG, sprite and Web Component must draw the same pixels, follow the colour variable, and match the golden images.
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: plugin
      - run: npm ci --no-audit --no-fund
        working-directory: e2e
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - run: npx playwright test
        working-directory: e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: render-diffs
          path: e2e/test-results
