name: ci
on:
  push:
  pull_request:
jobs:
  plugin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: plugin/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  companion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: git config --global user.email ci@example.com && git config --global user.name ci
      - run: node --test tools/icon-sync.test.mjs
  # TODO (docs/TEAM-REVIEW.md §5.5): ngc compile of generated Angular (14 + latest), Playwright render + pixel diff, size budgets.
